name: Tests

# Runs the Unity Test Framework in both modes on every PR into main.
# Also runnable by hand from the Actions tab.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the previous, still-running check.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    # Check names become "test (editmode)" and "test (playmode)".
    # Those exact strings are what branch protection requires -- if you rename
    # this job or the matrix values, update the protection rule to match.
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Binary assets live in Git LFS; without this the runner gets
          # pointer files and imports fail.
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - name: Run ${{ matrix.testMode }} tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          # ------------------------------------------------------------------
          # PLACEHOLDERS -- these secrets do not exist yet.
          # Until they are added under
          #   Settings > Secrets and variables > Actions,
          # this workflow WILL FAIL at Unity activation. That is expected.
          # See "CI secrets" in README.md for how to generate each value.
          #
          # Unity Personal licence (what a hobby team almost certainly wants):
          #   UNITY_LICENSE   -- full contents of the .ulf activation file
          #   UNITY_EMAIL     -- Unity account email
          #   UNITY_PASSWORD  -- Unity account password
          #
          # Unity Pro/Plus instead? Delete UNITY_LICENSE below, add:
          #   UNITY_SERIAL    -- your Pro serial key
          # and keep UNITY_EMAIL / UNITY_PASSWORD.
          #
          # NEVER commit a .ulf file or a serial to this repository.
          # ------------------------------------------------------------------
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.58f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          coverageOptions: generateAdditionalMetrics;generateHtmlReport

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.testMode }}
          path: ${{ matrix.testMode }}-artifacts
          if-no-files-found: warn
          retention-days: 14
